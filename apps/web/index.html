          <h3 style="font-size:1rem;font-weight:600;margin-top:1.25rem">What is Sommi AI?</h3>
          <p style="line-height:1.7;color:#444">
            Sommi is a personal AI sommelier and wine cellar web app. It helps home collectors track
            the bottles they own, understand when each wine reaches its optimal drink window, and get
            AI-powered pairing and occasion-based recommendations scoped to their actual
            collection &mdash; not generic wine reviews.
          </p>

          <h3 style="font-size:1rem;font-weight:600;margin-top:1.25rem">How is Sommi different from Vivino?</h3>
          <p style="line-height:1.7;color:#444">
            Vivino is a public wine review and rating community. Sommi is a personal cellar management
            tool: it tracks bottles you own, shows their individual drink windows, and gives AI pairing
            advice based on your specific inventory. Sommi supports Vivino-compatible CSV import so
            you can migrate your existing collection easily.
          </p>

          <h3 style="font-size:1rem;font-weight:600;margin-top:1.25rem">How does Sommi choose which wine to open tonight?</h3>
          <p style="line-height:1.7;color:#444">
            Sommi analyses the bottles in your personal cellar, checks each wine&rsquo;s drink window
            status (ready, needs aging, past peak), and lets you ask the built-in AI sommelier for
            occasion-based picks. Recommendations are always grounded in bottles you actually own.
          </p>
